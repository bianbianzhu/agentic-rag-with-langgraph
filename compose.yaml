services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: agentic_rag
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_rag -d agentic_rag"]
      interval: 1s
      timeout: 3s
      retries: 30
